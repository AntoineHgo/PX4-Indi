module_name: mc_indi_rate_control
parameters:
- group: Multicopter INDI Rate Control
  definitions:
    MC_INDI_EN:
      description:
        short: Use the INDI multicopter rate controller
        long: >-
          Start mc_indi_rate_control (incremental nonlinear dynamic inversion, see the MC_INDI_* parameters) instead of
          the PID based mc_rate_control. Only one of the two runs, selected at boot.
      type: boolean
      default: 0
      reboot_required: true
    MC_INDI_W_MAX:
      description:
        short: Rotor speed at full thrust (for the measured actuator torque)
        long: >-
          Rotor speed at which a motor produces its full normalised thrust, assuming thrust grows with the square of
          the rotor speed. Used with ESC rpm telemetry to compute the measured torque (topic actuator_torque_measured).
          Set to 0 to disable, INDI then uses its actuator model.
      type: float
      unit: rad/s
      min: 0
      max: 5000
      decimal: 1
      default: 0
    MC_INDI_G1_R:
      description:
        short: INDI roll control effectiveness
        long: Roll angular acceleration per unit of normalised torque.
      type: float
      unit: rad/s^2
      default: 1757.0
      min: 0.001
      max: 5000
      decimal: 1
      increment: 5
    MC_INDI_G1_P:
      description:
        short: INDI pitch control effectiveness
        long: Pitch angular acceleration per unit of normalised torque.
      type: float
      unit: rad/s^2
      default: 1640.0
      min: 0.001
      max: 5000
      decimal: 1
      increment: 5
    MC_INDI_G1_Y:
      description:
        short: INDI yaw control effectiveness
        long: Yaw angular acceleration per unit of normalised torque.
      type: float
      unit: rad/s^2
      default: 205.0
      min: 0.001
      max: 5000
      decimal: 1
      increment: 1
    MC_INDI_G2_Y:
      description:
        short: INDI yaw rotor spin-up term
        long: >-
          Yaw angular acceleration from the rotor inertia reaction per unit of normalised torque rate. Together with
          MC_INDI_G1_Y it sets a first order low pass on the yaw torque increment with time constant
          MC_INDI_G2_Y / MC_INDI_G1_Y and unchanged steady state gain. Set to 0 to disable. Too large a value reduces
          the stability margin.
      type: float
      unit: rad/s
      default: 27.0
      min: 0.0
      max: 1000
      decimal: 2
      increment: 0.1
    MC_INDI_ID_OK:
      description:
        short: INDI physical parameters identified
        long: |-
          0: Not identified yet, MC_INDI_K_R, MC_INDI_K_P and MC_INDI_K_Y are applied at half their value.
          1: Identified, the gains are applied as set.
      type: int32
      default: 0
      min: 0
      max: 1
    MC_INDI_K_R:
      description:
        short: INDI roll rate bandwidth
        long: Bandwidth of the closed loop roll rate tracking. Applied at half its value while MC_INDI_ID_OK is 0.
      type: float
      default: 20.0
      min: 1.0
      max: 100
      unit: rad/s
      decimal: 1
      increment: 1
    MC_INDI_K_P:
      description:
        short: INDI pitch rate bandwidth
        long: Bandwidth of the closed loop pitch rate tracking. Applied at half its value while MC_INDI_ID_OK is 0.
      type: float
      default: 20.0
      min: 1.0
      max: 100
      unit: rad/s
      decimal: 1
      increment: 1
    MC_INDI_K_Y:
      description:
        short: INDI yaw rate bandwidth
        long: Bandwidth of the closed loop yaw rate tracking. Applied at half its value while MC_INDI_ID_OK is 0.
      type: float
      default: 20.0
      min: 1.0
      max: 100
      unit: rad/s
      decimal: 1
      increment: 1
    MC_INDI_ACT_TC:
      description:
        short: INDI actuator time constant
        long: >-
          Time constant of the first order actuator model, also used by the rate lead (MC_INDI_LEAD). When unsure,
          round up.
      type: float
      default: 0.05
      min: 0.001
      max: 0.2
      unit: s
      decimal: 3
      increment: 0.001
    MC_INDI_LEAD:
      description:
        short: INDI rate lead scale
        long: >-
          Scales the rate prediction lead that cancels the actuator lag. The lead adds up to a factor 2 of this scale
          times the rate gain times MC_INDI_ACT_TC to the angular acceleration feedback gain. Set to 0 to disable.
          Raises motor command noise.
      type: float
      default: 1
      min: 0
      max: 1
      decimal: 2
      increment: 0.05
    MC_INDI_DELAY:
      description:
        short: INDI actuator model delay
        long: Pure delay of the actuator model in controller cycles.
      type: int32
      default: 0
      min: 0
      max: 4
    MC_INDI_ERPM_DLY:
      description:
        short: INDI measured torque delay
        long: >-
          Pure delay applied to the torque measured from the ESC rpm (actuator_torque_measured), in controller cycles,
          to match its latency to that of the filtered angular acceleration. Only used when MC_INDI_W_MAX is set.
      type: int32
      default: 1
      min: 0
      max: 4
    MC_INDI_ERPM_TO:
      description:
        short: INDI measured torque timeout
        long: >-
          Age of the oldest ESC sample behind the measured torque above which it is not used and INDI falls back to its
          actuator model. Only used when MC_INDI_W_MAX is set.
      type: float
      default: 0.02
      min: 0.001
      max: 0.5
      unit: s
      decimal: 3
      increment: 0.001
    MC_INDI_ACT_BLD:
      description:
        short: INDI actuator state blend time constant
        long: >-
          Time constant of the complementary blend between the measured (high frequency) and the modelled (low
          frequency) actuator torque. Restores the integral action of the model state against a steady command/output
          gap. Only used when MC_INDI_W_MAX is set. Set to 0 to disable (measured torque only), which removes the
          integral action against a weak motor or a thrust-map error.
      type: float
      default: 1.0
      min: 0.0
      max: 10.0
      unit: s
      decimal: 2
      increment: 0.05
    MC_INDI_INC_MAX:
      description:
        short: INDI maximum torque increment
        long: >-
          Limit of the torque increment per cycle and axis, in normalised torque.
          The output stays limited to [-1, 1].
      type: float
      default: 1.0
      min: 0.01
      max: 1
      decimal: 2
      increment: 0.05
    MC_INDI_LND_SLEW:
      description:
        short: INDI landed feedback torque slew
        long: >-
          Slew rate of the feedback torque on both edges of the landed flag (take-off and touch-down), in normalised
          torque per second. A change of the maybe landed state alone does not
          start the ramp.
      type: float
      unit: 1/s
      default: 5.0
      min: 0.5
      max: 100
      decimal: 1
      increment: 0.5
    MC_INDI_ERPM_FRZ:
      description:
        short: INDI frozen rotor speed detection time
        long: >-
          A motor whose reported rpm is bit-identical for this time while armed and whose command varied by more than
          0.02 in the same window is treated as offline for the measured torque path (modelled fallback).
      type: float
      unit: s
      default: 0.5
      min: 0.1
      max: 5
      decimal: 2
      increment: 0.1
    MC_INDI_SP_TO:
      description:
        short: INDI rate setpoint timeout
        long: >-
          When no rate setpoint arrives for this time while armed, the rate setpoint is set to zero and the thrust
          setpoint is held. Not used in acro mode.
      type: float
      unit: s
      default: 0.5
      min: 0.05
      max: 2
      decimal: 2
      increment: 0.05
    MC_INDI_YAW_CUT:
      description:
        short: INDI yaw feedback low-pass cutoff
        long: >-
          Extra low-pass on the yaw angular acceleration and torque feedback, and on the yaw rate error (setpoint
          included) used in the desired angular acceleration. Set to 0 to disable.
      type: float
      default: 0
      min: 0
      max: 100
      unit: Hz
      decimal: 1
      increment: 1
    MC_INDI_INJ_AX:
      description:
        short: INDI sysid excitation axis
        long: >-
          System identification only. Adds a multisine excitation to the INDI torque setpoint of one axis (the
          excitation is also fed back to the INDI actuator model) while armed and not landed, for MC_INDI_INJ_NP periods
          from the first such cycle. Off leaves the torque setpoint unchanged.
      type: enum
      values:
        0: Off
        1: Roll
        2: Pitch
        3: Yaw
      default: 0
    MC_INDI_INJ_AMP:
      description:
        short: INDI sysid excitation amplitude
        long: Amplitude of each sine component, in normalised torque. Only used when MC_INDI_INJ_AX is not 0.
      type: float
      default: 0.02
      min: 0
      max: 0.2
      decimal: 3
      increment: 0.005
    MC_INDI_INJ_TP:
      description:
        short: INDI sysid excitation period
        long: >-
          Period of the multisine excitation, the frequencies are integer
          multiples of 1/period. Only used when MC_INDI_INJ_AX is not 0.
      type: float
      default: 20
      min: 1
      max: 100
      unit: s
      decimal: 1
      increment: 1
    MC_INDI_INJ_FMIN:
      description:
        short: INDI sysid excitation lowest frequency
        long: >-
          Lowest frequency of the excitation, about 10 components per decade up to
          MC_INDI_INJ_FMAX (at most 64, the highest ones are dropped). Only used when MC_INDI_INJ_AX is not 0.
      type: float
      default: 0.5
      min: 0.01
      max: 50
      unit: Hz
      decimal: 2
      increment: 0.1
    MC_INDI_INJ_FMAX:
      description:
        short: INDI sysid excitation highest frequency
        long: Highest frequency of the excitation. Only used when MC_INDI_INJ_AX is not 0.
      type: float
      default: 60
      min: 0.1
      max: 200
      unit: Hz
      decimal: 1
      increment: 1
    MC_INDI_INJ_NP:
      description:
        short: INDI sysid excitation periods
        long: >-
          Number of periods of the excitation after it starts, then it stops. Only used when MC_INDI_INJ_AX is not 0.
      type: int32
      default: 3
      min: 1
      max: 20
    MC_INDI_INJ_DLY:
      description:
        short: INDI sysid excitation start delay
        long: >-
          Time from the first armed, airborne cycle to the start of the
          excitation. Only used when MC_INDI_INJ_AX is not 0.
      type: float
      unit: s
      default: 5.0
      min: 0
      max: 60
      decimal: 1
    MC_INDI_INJ_PT:
      description:
        short: INDI sysid excitation break point
        long: >-
          Where the MC_INDI_INJ_AX excitation enters. The torque setpoint break
          uses MC_INDI_INJ_AMP. The rate setpoint break (attitude loop) uses MC_INDI_INJ_AMPR and is zero unless an
          attitude controlled mode is active, the rate setpoint is fresh and the INDI controller reports no fault. The
          sequence restarts when those conditions are met again or this parameter changes. Only used when MC_INDI_INJ_AX is not 0.
      type: enum
      values:
        0: Torque setpoint
        1: Rate setpoint
      min: 0
      max: 1
      default: 0
    MC_INDI_INJ_AMPR:
      description:
        short: INDI sysid excitation amplitude on the rate setpoint
        long: >-
          Amplitude of each sine component added to the rate setpoint when MC_INDI_INJ_PT is 1.
          Only used when MC_INDI_INJ_AX is not 0.
      type: float
      default: 0.05
      min: 0
      max: 1
      unit: rad/s
      decimal: 3
      increment: 0.01
