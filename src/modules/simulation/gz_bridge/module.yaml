__max_num_motors: &max_num_motors 16
__max_num_servos: &max_num_servos 8
__max_num_tilts: &max_num_tilts 4

module_name: SIM_GZ
actuator_output:
  show_subgroups_if: 'SIM_GZ_EN>=1'
  config_parameters:
    - param: 'SIM_GZ_EN'
      label: 'Configure'
      function: 'enable'

  output_groups:
    - param_prefix: SIM_GZ_EC
      group_label: 'ESCs'
      channel_label: 'ESC'
      standard_params:
        disarmed: { min: 0, max: 1000, default: 0 }
        min: { min: 0, max: 1000, default: 0 }
        max: { min: 0, max: 1000, default: 1000 }
        failsafe: { min: 0, max: 1000 }
      custom_params:
        - name: 'SIGNED'
          label: "Signed Cmd\n(non-motor)"
          index_offset: -1
          show_as: bitset
          advanced: true
      num_channels: *max_num_motors
    - param_prefix: SIM_GZ_SV
      group_label: 'Servos'
      channel_label: 'Servo'
      standard_params:
        disarmed: { min: 0, max: 1000, default: 500 }
        min: { min: 0, max: 1000, default: 0 }
        max: { min: 0, max: 1000, default: 1000 }
        failsafe: { min: 0, max: 1000 }
      num_channels: *max_num_servos
    - param_prefix: SIM_GZ_WH
      group_label: 'Wheels'
      channel_label: 'Wheels'
      standard_params:
        disarmed: { min: 0, max: 200, default: 100 }
        min: { min: 0, max: 200, default: 0 }
        max: { min: 0, max: 200, default: 200 }
        failsafe: { min: 0, max: 200 }
      num_channels: 4

parameters:
    - group: Geometry
      definitions:
        SIM_GZ_SV_MAXA${i}:
            description:
                short: Servo ${i} Angle at Maximum
                long: |
                  Defines the angle when the servo is at the maximum.
                  Currently only supported in gz simulation and must be coherent with .sdf file and CA_SV_TL{n}_MAXA.
            type: float
            decimal: 0
            unit: 'deg'
            num_instances: *max_num_servos
            instance_start: 1
            min: -180.0
            max: 180.0
            default: 45.0
        SIM_GZ_SV_MINA${i}:
            description:
                short: Servo ${i} Angle at Minimum
                long: |
                  Defines the angle when the servo is at the minimum.
                  Currently only supported in gz simulation and must be coherent with .sdf file and CA_SV_TL{n}_MINA.
            type: float
            decimal: 0
            unit: 'deg'
            num_instances: *max_num_servos
            instance_start: 1
            min: -180.0
            max: 180.0
            default: -45.0
    - group: Simulation
      definitions:
        SIM_GZ_ESC_FB:
          description:
            short: Source of simulated ESC rotor speed feedback
            long: Selects what esc_status esc_rpm reports. Echo returns the motor speed command
              sent to Gazebo (no motor dynamics, command units). Joint state reports the rotor speed
              of the simulated motor in rpm, read from the model's JointStatePublisher system
              (rotor joints named rotor_N_joint, rotorVelocitySlowdownSim 10). The eRPM model adds one output
              period of latency, the AM32 period encoding, the PX4 100 eRPM rounding and dropped frames.
          type: enum
          values:
            0: Echo motor command
            1: Rotor joint state
            2: Rotor joint state through a bidirectional DShot eRPM model
          default: 0
          reboot_required: true
        SIM_GZ_ERPM_POL:
          description:
            short: Motor pole count of the simulated eRPM telemetry
            long: Used by SIM_GZ_ESC_FB 2 to convert rotor speed to eRPM and back, as DSHOT_MOT_POLn on hardware.
          type: int32
          min: 2
          max: 64
          default: 14
          reboot_required: true
        SIM_GZ_ERPM_DRP:
          description:
            short: Probability of a dropped eRPM telemetry frame
            long: Used by SIM_GZ_ESC_FB 2. A dropped frame (CRC failure) keeps the last decoded value and increments
              esc_errorcount, as the PX4 DShot driver does.
          type: float
          min: 0.0
          max: 1.0
          decimal: 3
          default: 0.0
          reboot_required: true
        SIM_GZ_ERPM_LAT:
          description:
            short: Extra eRPM telemetry latency
            long: Used by SIM_GZ_ESC_FB 2. Frames (ESC output periods) of latency added to the one-frame reply
              latency of the eRPM model.
          type: int32
          min: 0
          max: 8
          default: 0
          reboot_required: true
        SIM_GZ_ERPM_LOSS:
          description:
            short: Motors with total eRPM telemetry loss
            long: Used by SIM_GZ_ESC_FB 2. Bit i set makes every eRPM frame of motor i fail (held value,
              esc_errorcount increments). Read at runtime, for timed telemetry-loss scenarios.
          type: int32
          min: 0
          max: 255
          default: 0
        SIM_GZ_THR_SC:
          description:
            short: Available thrust scale of all motors
            long: Motor output rotor speeds are multiplied by the square root of this value, so the thrust
              at a given command scales by it (battery sag model). Read at runtime.
          type: float
          min: 0.0
          max: 1.0
          decimal: 3
          default: 1.0
        SIM_GZ_VIB_ACC:
          description:
            short: Simulated IMU vibration, accelerometer amplitude per rotor
            long: Adds to the first IMU a sinusoidal vibration per rotor at its rotation frequency (in the rotor plane)
              and at the blade-pass frequency of a two-blade propeller (along the thrust axis, half amplitude), scaled
              with rotor speed squared. Needs SIM_GZ_ESC_FB 1 or 2 (rotor joint speeds). 0 disables.
          type: float
          unit: m/s^2
          min: 0.0
          max: 50.0
          decimal: 2
          default: 0.0
          reboot_required: true
        SIM_GZ_VIB_GYR:
          description:
            short: Simulated IMU vibration, gyroscope amplitude per rotor
            long: Gyroscope counterpart of SIM_GZ_VIB_ACC (roll and pitch at the rotation frequency, yaw at the
              blade-pass frequency at 0.2 of the amplitude). 0 disables.
          type: float
          unit: rad/s
          min: 0.0
          max: 5.0
          decimal: 3
          default: 0.0
          reboot_required: true
        SIM_GZ_VIB_RPM:
          description:
            short: Rotor speed at which the SIM_GZ_VIB amplitudes apply
          type: float
          unit: rpm
          min: 100.0
          max: 100000.0
          decimal: 0
          default: 7000.0
          reboot_required: true
        SIM_GZ_EC_SIGNED:
          description:
            short: Signed command for non-motor ESC channels
            long: For motors, use CA_R_REV; bits set here for motor channels are ignored.
              Select simulated ESC channels assigned a non-motor function (e.g. Peripheral
              via Actuator Set or Servo) to send values from -MAX (full reverse) to +MAX
              (full forward), with 0 as neutral. For signed channels, keep DISARMED at 0,
              set MIN to 1, and use FAILSAFE 0 for neutral failsafe behavior.
              Failsafe values use the same MIN/MAX-to-signed mapping as normal outputs.
              Mirrors UAVCAN_EC_SIGNED.
          type: bitmask
          bit:
            0: ESC1
            1: ESC2
            2: ESC3
            3: ESC4
            4: ESC5
            5: ESC6
            6: ESC7
            7: ESC8
            8: ESC9
            9: ESC10
            10: ESC11
            11: ESC12
            12: ESC13
            13: ESC14
            14: ESC15
            15: ESC16
          default: 0
          reboot_required: true
