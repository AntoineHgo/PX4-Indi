module_name: mc_rate_control
parameters:
- group: Multicopter Rate Control
  definitions:
    MC_ROLLRATE_P:
      description:
        short: Roll rate P gain
        long: Roll rate proportional gain, i.e. control output for angular speed error
          1 rad/s.
      type: float
      default: 0.15
      min: 0.01
      max: 0.5
      decimal: 3
      increment: 0.01
    MC_ROLLRATE_I:
      description:
        short: Roll rate I gain
        long: Roll rate integral gain. Can be set to compensate static thrust difference
          or gravity center offset.
      type: float
      default: 0.2
      min: 0.0
      decimal: 3
      increment: 0.01
    MC_RR_INT_LIM:
      description:
        short: Roll rate integrator limit
        long: Roll rate integrator limit. Can be set to increase the amount of integrator
          available to counteract disturbances or reduced to improve settling time
          after large roll moment trim changes.
      type: float
      default: 0.3
      min: 0.0
      decimal: 2
      increment: 0.01
    MC_ROLLRATE_D:
      description:
        short: Roll rate D gain
        long: Roll rate differential gain. Small values help reduce fast oscillations.
          If value is too big oscillations will appear again.
      type: float
      default: 0.003
      min: 0.0
      max: 0.01
      decimal: 4
      increment: 0.0005
    MC_ROLLRATE_FF:
      description:
        short: Roll rate feedforward
        long: Improves tracking performance.
      type: float
      default: 0.0
      min: 0.0
      decimal: 4
    MC_ROLLRATE_K:
      description:
        short: Roll rate controller gain
        long: |-
          Global gain of the controller.

          This gain scales the P, I and D terms of the controller:
          ```
          output = MC_ROLLRATE_K * (MC_ROLLRATE_P * error
          + MC_ROLLRATE_I * error_integral
          + MC_ROLLRATE_D * error_derivative)
          ```
          Set MC_ROLLRATE_P=1 to implement a PID in the ideal form.
          Set MC_ROLLRATE_K=1 to implement a PID in the parallel form.
      type: float
      default: 1.0
      min: 0.01
      max: 5.0
      decimal: 4
      increment: 0.0005
    MC_PITCHRATE_P:
      description:
        short: Pitch rate P gain
        long: Pitch rate proportional gain, i.e. control output for angular speed
          error 1 rad/s.
      type: float
      default: 0.15
      min: 0.01
      max: 0.6
      decimal: 3
      increment: 0.01
    MC_PITCHRATE_I:
      description:
        short: Pitch rate I gain
        long: Pitch rate integral gain. Can be set to compensate static thrust difference
          or gravity center offset.
      type: float
      default: 0.2
      min: 0.0
      decimal: 3
      increment: 0.01
    MC_PR_INT_LIM:
      description:
        short: Pitch rate integrator limit
        long: Pitch rate integrator limit. Can be set to increase the amount of integrator
          available to counteract disturbances or reduced to improve settling time
          after large pitch moment trim changes.
      type: float
      default: 0.3
      min: 0.0
      decimal: 2
      increment: 0.01
    MC_PITCHRATE_D:
      description:
        short: Pitch rate D gain
        long: Pitch rate differential gain. Small values help reduce fast oscillations.
          If value is too big oscillations will appear again.
      type: float
      default: 0.003
      min: 0.0
      decimal: 4
      increment: 0.0005
    MC_PITCHRATE_FF:
      description:
        short: Pitch rate feedforward
        long: Improves tracking performance.
      type: float
      default: 0.0
      min: 0.0
      decimal: 4
    MC_PITCHRATE_K:
      description:
        short: Pitch rate controller gain
        long: |-
          Global gain of the controller.

          This gain scales the P, I and D terms of the controller:
          ```
          output = MC_PITCHRATE_K * (MC_PITCHRATE_P * error
          + MC_PITCHRATE_I * error_integral
          + MC_PITCHRATE_D * error_derivative)
          ```
          Set MC_PITCHRATE_P=1 to implement a PID in the ideal form.
          Set MC_PITCHRATE_K=1 to implement a PID in the parallel form.
      type: float
      default: 1.0
      min: 0.01
      max: 5.0
      decimal: 4
      increment: 0.0005
    MC_YAWRATE_P:
      description:
        short: Yaw rate P gain
        long: Yaw rate proportional gain, i.e. control output for angular speed error
          1 rad/s.
      type: float
      default: 0.2
      min: 0.0
      max: 0.6
      decimal: 3
      increment: 0.01
    MC_YAWRATE_I:
      description:
        short: Yaw rate I gain
        long: Yaw rate integral gain. Can be set to compensate static thrust difference
          or gravity center offset.
      type: float
      default: 0.1
      min: 0.0
      decimal: 3
      increment: 0.01
    MC_YR_INT_LIM:
      description:
        short: Yaw rate integrator limit
        long: Yaw rate integrator limit. Can be set to increase the amount of integrator
          available to counteract disturbances or reduced to improve settling time
          after large yaw moment trim changes.
      type: float
      default: 0.3
      min: 0.0
      decimal: 2
      increment: 0.01
    MC_YAWRATE_D:
      description:
        short: Yaw rate D gain
        long: Yaw rate differential gain. Small values help reduce fast oscillations.
          If value is too big oscillations will appear again.
      type: float
      default: 0.0
      min: 0.0
      decimal: 4
      increment: 0.0005
    MC_YAWRATE_FF:
      description:
        short: Yaw rate feedforward
        long: Improves tracking performance.
      type: float
      default: 0.0
      min: 0.0
      decimal: 4
    MC_YAWRATE_K:
      description:
        short: Yaw rate controller gain
        long: |-
          Global gain of the controller.

          This gain scales the P, I and D terms of the controller:
          ```
          output = MC_YAWRATE_K * (MC_YAWRATE_P * error
          + MC_YAWRATE_I * error_integral
          + MC_YAWRATE_D * error_derivative)
          ```
          Set MC_YAWRATE_P=1 to implement a PID in the ideal form.
          Set MC_YAWRATE_K=1 to implement a PID in the parallel form.
      type: float
      default: 1.0
      min: 0.01
      max: 5.0
      decimal: 4
      increment: 0.0005
    MC_BAT_SCALE_EN:
      description:
        short: Battery power level scaler
        long: |-
          This compensates for voltage drop of the battery over time by attempting to
          normalize performance across the operating range of the battery. The copter
          should constantly behave as if it was fully charged with reduced max acceleration
          at lower battery percentages. i.e. if hover is at 0.5 throttle at 100% battery,
          it will still be 0.5 at 60% battery.
      type: boolean
      default: 0
    MC_YAW_TQ_CUTOFF:
      description:
        short: Low pass filter cutoff frequency for yaw torque setpoint
        long: |-
          Reduces vibrations by lowering high frequency torque caused by rotor acceleration.
          0 disables the filter
      type: float
      default: 2.0
      min: 0
      max: 10
      unit: Hz
      decimal: 3
    MC_RATE_CTL_TYPE:
      description:
        short: Rate control law
        long: |-
          PID: standard PID rate controller.
          INDI: incremental nonlinear dynamic inversion, see the MC_INDI_* parameters.
          Latched while disarmed, a change takes effect at the next arming.
      type: enum
      values:
        0: PID
        1: INDI
      default: 0
      min: 0
      max: 1
    MC_INDI_G1_R:
      description:
        short: INDI roll control effectiveness
        long: Roll angular acceleration in rad/s^2 per unit of normalised torque. Only used when MC_RATE_CTL_TYPE is INDI.
      type: float
      default: 320.0
      min: 0.001
      max: 5000
      decimal: 1
      increment: 5
    MC_INDI_G1_P:
      description:
        short: INDI pitch control effectiveness
        long: Pitch angular acceleration in rad/s^2 per unit of normalised torque. Only used when MC_RATE_CTL_TYPE is INDI.
      type: float
      default: 210.0
      min: 0.001
      max: 5000
      decimal: 1
      increment: 5
    MC_INDI_G1_Y:
      description:
        short: INDI yaw control effectiveness
        long: Yaw angular acceleration in rad/s^2 per unit of normalised torque. The default is not identified for any airframe. Only used when MC_RATE_CTL_TYPE is INDI.
      type: float
      default: 30.0
      min: 0.001
      max: 5000
      decimal: 1
      increment: 1
    MC_INDI_G2_Y:
      description:
        short: INDI yaw rotor spin-up term
        long: Yaw angular acceleration in rad/s^2 per unit of normalised torque rate (rad/s^2 per 1/s). Set to 0 to disable. Only used when MC_RATE_CTL_TYPE is INDI.
      type: float
      default: 0.0
      min: 0.0
      max: 100
      decimal: 2
      increment: 0.1
    MC_INDI_K_R:
      description:
        short: INDI roll rate bandwidth
        long: Closed loop roll rate tracking bandwidth. Only used when MC_RATE_CTL_TYPE is INDI.
      type: float
      default: 20.0
      min: 1.0
      max: 100
      unit: rad/s
      decimal: 1
      increment: 1
    MC_INDI_K_P:
      description:
        short: INDI pitch rate bandwidth
        long: Closed loop pitch rate tracking bandwidth. Only used when MC_RATE_CTL_TYPE is INDI.
      type: float
      default: 20.0
      min: 1.0
      max: 100
      unit: rad/s
      decimal: 1
      increment: 1
    MC_INDI_K_Y:
      description:
        short: INDI yaw rate bandwidth
        long: Closed loop yaw rate tracking bandwidth. Only used when MC_RATE_CTL_TYPE is INDI.
      type: float
      default: 10.0
      min: 1.0
      max: 100
      unit: rad/s
      decimal: 1
      increment: 1
    MC_INDI_ACT_TC:
      description:
        short: INDI actuator time constant
        long: Time constant of the first order actuator model. Only used when MC_RATE_CTL_TYPE is INDI.
      type: float
      default: 0.02
      min: 0.001
      max: 0.2
      unit: s
      decimal: 3
      increment: 0.001
    MC_INDI_DELAY:
      description:
        short: INDI actuator model delay
        long: Pure delay of the actuator model in controller cycles. Only used when MC_RATE_CTL_TYPE is INDI.
      type: int32
      default: 0
      min: 0
      max: 4
    MC_INDI_DT_MAX:
      description:
        short: INDI maximum torque increment
        long: Limit of the torque increment per cycle and axis. Only used when MC_RATE_CTL_TYPE is INDI.
      type: float
      default: 1.0
      min: 0.01
      max: 1
      decimal: 2
      increment: 0.05
